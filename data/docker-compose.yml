# Ad Spend Autopilot demo data: one Postgres server with three databases
# (metadb, googledb, revdb) on the Zetaris Docker network, reachable by the
# Zetaris driver as autopilot-pg:5432. Seeds run once on an empty volume.
#
#   npm run data:up
#   docker compose -f data/docker-compose.yml down -v && npm run data:up   # re-seed
services:
  autopilot-pg:
    image: postgres:16-alpine
    container_name: autopilot-pg
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: ${AUTOPILOT_PG_PASSWORD:-autopilot_local_dev}
      POSTGRES_DB: autopilot
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
      - autopilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d revdb"]
      interval: 5s
      retries: 30
    networks: [zetaris]

volumes:
  autopilot-pgdata:

networks:
  zetaris:
    external: true
    name: zetaris_default
